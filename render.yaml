services:
  - type: web
    name: the-birthday
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: birthday-data
      mountPath: /var/data
      sizeGB: 1
