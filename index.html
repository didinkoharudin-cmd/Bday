<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE BIRTHDAY</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#25395c,#0a1020 65%);color:#f5e6c7;font:16px system-ui;min-height:100dvh}main{max-width:600px;margin:auto;padding:28px 22px;text-align:center}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(36px,8vw,64px);margin:20px 0}small{letter-spacing:4px;color:#d5b574}button,.btn{display:inline-block;border:1px solid #e6c68b;border-radius:30px;background:linear-gradient(110deg,#b58a48,#f4dfac);color:#211a10;padding:13px 24px;font-weight:600;cursor:pointer;text-decoration:none;margin:6px}button.secondary{background:transparent;color:#e6c68b}input,textarea{display:block;width:100%;padding:12px;background:#111d31;color:white;border:1px solid #536079;border-radius:9px;margin:8px 0 18px;font:inherit}label{display:block;text-align:left;font-size:13px}textarea{min-height:130px}p{line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.panel{border:1px solid #a78b524d;border-radius:24px;padding:24px;background:#101a2caa}.scene{min-height:85dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;animation:appear .8s ease}.gift{font-size:110px;animation:float 2s infinite ease-in-out;cursor:pointer}.star{position:fixed;background:#ffe5ac;border-radius:50%;pointer-events:none;animation:twinkle 3s infinite alternate;z-index:-1}.confetti{position:fixed;top:-20px;pointer-events:none;animation:fall 4s linear forwards;z-index:10}.photo{width:100%;max-height:50vh;object-fit:contain;border:5px solid #e6c68b;border-radius:8px}.entry{padding:12px;border-bottom:1px solid #ffffff22;text-align:left}.cake{font-size:90px}.flame{display:inline-block;background:#ffcc65;width:12px;height:25px;border-radius:70% 30% 60% 40%;box-shadow:0 0 25px #ffb344;animation:twinkle .4s infinite alternate}.muted{color:#b7bfd0;font-size:13px}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes twinkle{from{opacity:.25}to{opacity:1}}@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><main id="app"></main><script>
const app=document.querySelector('#app'),$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let password='',cards={},editing='',photos=[],music='',card,step=0,photoIndex=0,audio;const id=new URLSearchParams(location.search).get('gift');for(let i=0;i<70;i++){let s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:2px;height:2px;animation-delay:${Math.random()*4}s`;document.body.append(s)}
async function api(url,method='GET',data){const r=await fetch(url,{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
function link(k){return location.origin+'/?gift='+k}function login(){app.innerHTML='<div class="scene"><small>THE BIRTHDAY</small><h1>Studio</h1><p>A Moment Made for You</p><form id="login" class="panel"><label>Password admin<input id="pw" type="password" required></label><button>Masuk Studio</button><p id="err" role="alert"></p></form><button class="secondary" id="demo">Lihat demo</button></div>';$('login').onsubmit=async e=>{e.preventDefault();password=$('pw').value;try{cards=await api('/api/cards');admin()}catch(e){$('err').textContent=e.message}};$('demo').onclick=()=>{card={name:'Someone Special',sender:'Your Friends',message:'Semoga setiap langkah membawa kebahagiaan dan setiap harapan menemukan jalannya.',photos:[]};render()}}
function admin(){app.innerHTML=`<small>THE BIRTHDAY • STUDIO</small><h2>${editing?'Edit ucapan':'Buat ucapan baru'}</h2><form id="form" class="panel"><label>Nama penerima<input id="name" required maxlength="100"></label><label>Nama pengirim<input id="sender" maxlength="100"></label><label>Tanggal ulang tahun<input id="date" type="date"></label><label>Pesan rahasia<textarea id="message" maxlength="5000"></textarea></label><label>Foto kenangan (maks. 8, JPEG/PNG/WebP)<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><p id="photoCount" class="muted"></p><button type="button" class="secondary" id="clearPhotos">Hapus foto</button><label>Musik milik sendiri / berlisensi (maks. 5 MB)<input id="music" type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/x-m4a"></label><p id="musicStatus" class="muted"></p><button type="button" class="secondary" id="clearMusic">Hapus musik</button><p id="status" role="alert"></p><button id="save">Simpan & buat link</button><button type="button" class="secondary" id="new">Buat baru</button></form><h2>Ucapan tersimpan</h2><div id="list"></div><button class="secondary" id="logout">Keluar</button>`;const d=cards[editing]||{};for(const k of ['name','sender','date','message'])$(k).value=d[k]||'';photos=[...(d.photos||[])];music=d.music||'';const update=()=>{$('photoCount').textContent=photos.length+' foto tersimpan';$('musicStatus').textContent=music?'Musik tersedia':'Tanpa musik'};update();$('clearPhotos').onclick=()=>{photos=[];update()};$('clearMusic').onclick=()=>{music='';update()};$('photos').onchange=async()=>{try{const files=[...$('photos').files];if(files.length>8)throw Error('Maksimal 8 foto');$('save').disabled=true;photos=await Promise.all(files.map(resize));update()}catch(e){$('status').textContent=e.message}finally{$('save').disabled=false}};$('music').onchange=async()=>{try{const f=$('music').files[0];if(!f)return;if(f.size>5e6)throw Error('Musik maksimal 5 MB');$('save').disabled=true;music=await read(f);update()}catch(e){$('status').textContent=e.message}finally{$('save').disabled=false}};$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const d={id:editing,photos,music};for(const k of ['name','sender','date','message'])d[k]=$(k).value;const res=await api('/api/cards','POST',d);cards=await api('/api/cards');editing=res.id;admin();$('status').textContent='Tersimpan! Gunakan tombol bagikan di bawah.'}catch(e){$('status').textContent=e.message;$('save').disabled=false}};$('new').onclick=()=>{editing='';admin()};$('logout').onclick=()=>{password='';cards={};editing='';login()};for(const [k,d] of Object.entries(cards)){const el=document.createElement('div');el.className='entry';el.innerHTML=`<strong>${esc(d.name)}</strong><p class="muted">${esc(d.date)}</p><a class="btn" href="${link(k)}" target="_blank" rel="noopener">Preview</a><button data-a="share">Bagikan WA</button><button data-a="copy" class="secondary">Salin link</button><button data-a="edit" class="secondary">Edit</button><button data-a="delete" class="secondary">Hapus</button>`;el.onclick=async e=>{const a=e.target.dataset.a;try{if(a==='share')window.open('https://wa.me/?text='+encodeURIComponent('Ada kejutan spesial untukmu ✨ '+link(k)),'_blank','noopener');if(a==='copy'){await navigator.clipboard.writeText(link(k));e.target.textContent='Tersalin'}if(a==='edit'){editing=k;admin();window.scrollTo(0,0)}if(a==='delete'&&confirm('Hapus ucapan ini?')){await api('/api/cards/'+k,'DELETE');delete cards[k];editing='';admin()}}catch(e){alert(e.message)}};$('list').append(el)}}
function read(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}async function resize(f){const img=new Image();img.src=await read(f);await img.decode();const c=document.createElement('canvas'),s=Math.min(1,1400/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
function celebrate(){for(let i=0;i<100;i++){const x=document.createElement('i');x.className='confetti';x.style.cssText=`left:${Math.random()*100}%;width:6px;height:12px;background:${['#e6c68b','#fff','#b08c49','#91b9dd'][i%4]};animation-delay:${Math.random()*1.5}s`;document.body.append(x);setTimeout(()=>x.remove(),6000)}}
function render(){const n=esc(card.name),p=card.photos||[];let content=[`<small>A SPECIAL DELIVERY</small><h1>${n}</h1><div class="gift" aria-hidden="true">🎁</div><p>Ada sesuatu yang istimewa untukmu.</p><button id="next">Buka hadiah</button>`,`<small>MAKE A WISH</small><h2>Satu harapan untuk tahun yang baru</h2><div class="flame" id="flame"></div><div class="cake">🎂</div><p>Pejamkan mata dan buat satu harapan.</p><button id="next">Tiup lilin dengan sentuhan</button>`,`<small>BEAUTIFUL MEMORIES</small><h2>Setiap momen begitu berarti</h2>${p.length?`<img class="photo" id="photo" alt="Foto kenangan"><p id="counter"></p><div><button id="prev" class="secondary">‹</button><button id="forward" class="secondary">›</button></div>`:'<p>Kenangan terbaik adalah yang masih akan kita ciptakan.</p>'}<button id="next">Lanjutkan</button>`,`<small>A LETTER FOR YOU</small><div style="font-size:70px">💌</div><h2>Untuk ${n}</h2><button id="letter">Buka surat rahasia</button><div id="letterBody" hidden class="panel"><p>${esc(card.message||'Selamat ulang tahun. Semoga bahagia selalu!')}</p><p>— ${esc(card.sender||'Seseorang yang peduli')}</p><button id="next">Kejutan terakhir</button></div>`,`<small>TODAY WE CELEBRATE YOU</small><h1>Happy<br>Birthday!</h1><h2>${n}</h2><p>${esc(card.date||'')}<br>Another year, another beautiful chapter.</p><button id="next">Ulangi kejutan</button><button id="share" class="secondary">Bagikan</button>`][step];app.innerHTML='<section class="scene">'+content+'<p class="muted">'+(step+1)+' / 5</p>'+(card.music?'<button class="secondary" id="sound">Musik ♪</button>':'')+'</section>';if($('sound'))$('sound').onclick=()=>{if(!audio)audio=new Audio(card.music);if(audio.paused){audio.loop=true;audio.play().catch(()=>alert('Musik tidak dapat diputar'))}else audio.pause()};if($('letter'))$('letter').onclick=()=>{$('letterBody').hidden=false;$('letter').hidden=true};if($('photo')){const show=()=>{$('photo').src=p[photoIndex];$('counter').textContent=(photoIndex+1)+' / '+p.length};show();$('prev').onclick=()=>{photoIndex=(photoIndex+p.length-1)%p.length;show()};$('forward').onclick=()=>{photoIndex=(photoIndex+1)%p.length;show()}};$('next').onclick=()=>{if(step===0&&card.music&&!audio){audio=new Audio(card.music);audio.loop=true;audio.play().catch(()=>{})}if(step===1){$('flame').style.visibility='hidden';celebrate();$('next').disabled=true;setTimeout(()=>{step++;render()},900);return}step=(step+1)%5;render();if(step===4)celebrate()};if($('share'))$('share').onclick=()=>{if(navigator.share)navigator.share({title:'The Birthday',url:location.href}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(location.href),'_blank','noopener')}}
if(id)api('/api/cards/'+encodeURIComponent(id)).then(d=>{card=d;render()}).catch(()=>app.textContent='Ucapan tidak ditemukan atau telah dihapus.');else login();
</script></html>
